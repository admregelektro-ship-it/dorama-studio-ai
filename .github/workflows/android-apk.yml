name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/scenes-production-android
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Validar codigo
        run: npm test

      - name: Empacotar SDK Supabase e Capacitor
        run: npm run build

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Preparar integracao Android
        run: npm run android:prepare

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Dorama-Studio-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
