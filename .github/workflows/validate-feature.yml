name: Validate Studio (no APK)
on:
  workflow_dispatch:
  push:
    branches:
      - fix/scenes-production-android
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build web assets
        run: npm run build
      - name: Verify bundled SDK
        run: test -s www/vendor.js
